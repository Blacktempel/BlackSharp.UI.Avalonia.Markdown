name: Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Optional release title (defaults to the tag)
        required: false
        default: ''
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_ID: BlackSharp.UI.Avalonia.Markdown
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  validate_release_inputs:
    name: Validate release inputs
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Read package version and validate release tag
        id: version
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:GITHUB_REF -cne "refs/heads/$env:DEFAULT_BRANCH") {
            throw "Run the Release workflow from the default branch '$env:DEFAULT_BRANCH'."
          }

          dotnet msbuild BlackSharp.UI.Avalonia.Markdown/BlackSharp.UI.Avalonia.Markdown.csproj -nologo -t:ValidateBlackSharpVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $version = (Get-Content -LiteralPath Versions/BLACKSHARP.VERSION -Raw).Trim()
          git check-ref-format "refs/tags/$version"
          if ($LASTEXITCODE -ne 0) {
            throw "The generated Git tag is invalid: $version."
          }

          $remoteTag = @(git ls-remote --tags origin "refs/tags/$version")
          if ($LASTEXITCODE -ne 0) {
            throw 'The existing Git tags could not be checked.'
          }
          if ($remoteTag.Count -gt 0) {
            throw "The Git tag already exists: $version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

  build_packages:
    name: Build and test release packages
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate_release_inputs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      upload_build_artifacts: true

  create_draft_release:
    name: Create draft GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - validate_release_inputs
      - build_packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Markdown-NuGet-${{ needs.validate_release_inputs.outputs.version }}
          path: staging/NuGet

      - name: Download compiled libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Markdown-Libraries-${{ needs.validate_release_inputs.outputs.version }}
          path: staging/Libraries

      - name: Verify and archive release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate_release_inputs.outputs.version }}
        run: |
          $expectedName = "$env:PACKAGE_ID.$env:RELEASE_TAG.nupkg"
          $packages = @(Get-ChildItem -LiteralPath staging/NuGet -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -cne $expectedName) {
            throw "Expected exactly one NuGet package named '$expectedName'."
          }

          $releaseDirectory = (New-Item -ItemType Directory -Path release-assets).FullName

          foreach ($component in @('NuGet', 'Libraries')) {
            $source = (Resolve-Path -LiteralPath "staging/$component").Path
            $destination = Join-Path $releaseDirectory "$env:PACKAGE_ID-$component-$env:RELEASE_TAG.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $source, $destination, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          }

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate_release_inputs.outputs.version }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $releaseTags = @(gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) {
            throw 'The existing releases and drafts could not be checked.'
          }
          if ($env:RELEASE_TAG -cin $releaseTags) {
            throw "A release or draft already exists for $env:RELEASE_TAG."
          }

          $title = $env:RELEASE_NAME
          if ([string]::IsNullOrWhiteSpace($title)) {
            $title = $env:RELEASE_TAG
          }

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--target', $env:GITHUB_SHA,
            '--title', $title,
            '--draft',
            '--generate-notes'
          )
          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          $arguments += @(Get-ChildItem -LiteralPath release-assets -Filter '*.zip' -File | Sort-Object Name | ForEach-Object { $_.FullName })

          $releaseUrl = gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'The draft release could not be created.'
          }

          @(
            '### Draft release created'
            ''
            "[$env:RELEASE_TAG]($releaseUrl) is ready for review."
            'Publish the draft to upload its verified package to nuget.org.'
          ) >> $env:GITHUB_STEP_SUMMARY

  publish_nuget:
    name: Publish NuGet package
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate NuGet publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'The NUGET_USER repository variable must contain your nuget.org username.'
          }

      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download the released NuGet archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          dotnet msbuild BlackSharp.UI.Avalonia.Markdown/BlackSharp.UI.Avalonia.Markdown.csproj -nologo -t:ValidateBlackSharpVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $version = (Get-Content -LiteralPath Versions/BLACKSHARP.VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -cne $version) {
            throw "Release tag '$env:RELEASE_TAG' does not match package version '$version'."
          }

          $archiveName = "$env:PACKAGE_ID-NuGet-$version.zip"
          New-Item -ItemType Directory -Path dist | Out-Null
          gh release download $env:RELEASE_TAG --pattern $archiveName --dir dist
          if ($LASTEXITCODE -ne 0) {
            throw "The release archive '$archiveName' could not be downloaded."
          }

          Expand-Archive -LiteralPath "dist/$archiveName" -DestinationPath dist/packages

      - name: Verify the released NuGet package
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $expectedName = "$env:PACKAGE_ID.$env:RELEASE_TAG.nupkg"
          $packages = @(Get-ChildItem -LiteralPath dist/packages/NuGet -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -cne $expectedName) {
            throw "Expected exactly one NuGet package named '$expectedName'."
          }

          $package = $packages[0]
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $specifications = @($archive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec', [StringComparison]::Ordinal) })
            if ($specifications.Count -ne 1) {
              throw "Expected exactly one NuGet specification in '$expectedName'."
            }

            $reader = [System.IO.StreamReader]::new($specifications[0].Open())
            try {
              [xml]$specification = $reader.ReadToEnd()
            }
            finally {
              $reader.Dispose()
            }

            $packageID = [string]$specification.package.metadata.id
            $packageVersion = [string]$specification.package.metadata.version
            if ($packageID -cne $env:PACKAGE_ID -or $packageVersion -cne $env:RELEASE_TAG) {
              throw "Unexpected NuGet metadata: package '$packageID', version '$packageVersion'."
            }
          }
          finally {
            $archive.Dispose()
          }

          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT

      - name: Log in to NuGet using Trusted Publishing
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the verified package to nuget.org
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet Trusted Publishing did not return a temporary API key.'
          }

          dotnet nuget push $env:PACKAGE_PATH --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            throw 'NuGet publication failed.'
          }
